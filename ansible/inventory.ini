# inventory.ini - the list of machines Ansible is allowed to touch.
#
# Right now there is exactly one "machine": this one. `ansible_connection=local`
# tells Ansible to skip SSH entirely and just run commands here, which is why
# this works with no keys, no agent, and no firewall rules.

# [lab] Intial lab set up targeing local hosts
# localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"
[oci_lab]
vm01 ansible_host=129.80.220.235 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/vm01_private.key ansible_ssh_common_args='-o StrictHostKeyChecking=no'
# ---------------------------------------------------------------------------
# When you're ready to point this at your second OCI instance, comment out the
# block above and uncomment this one. Nothing in run.py or the playbook needs
# to change -- that's the point of keeping the inventory separate.
#
# [lab]
# lab-target ansible_host=10.0.1.42 ansible_user=opc
#
# [lab:vars]
# ansible_ssh_private_key_file=~/.ssh/oci_lab_key
# ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
#
# Two things to get right before that first remote run:
#   1. `ssh -i ~/.ssh/oci_lab_key opc@10.0.1.42` must work by hand first.
#      If it doesn't work manually, Ansible won't fix it.
#   2. The Jenkins service account needs that key. Don't leave it in the repo --
#      put it in Jenkins' credentials store and pull it in with the
#      sshagent() or withCredentials() step in the Jenkinsfile.
# ---------------------------------------------------------------------------
